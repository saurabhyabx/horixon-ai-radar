name: Daily radar

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours: 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also build the weekly digest + newsletter draft"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install (only the optional Claude SDK)
        run: npm install --no-audit --no-fund
      - name: Collect, rank, publish, send live alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HORIXON_SITE_URL: ${{ vars.HORIXON_SITE_URL }}
        run: node backend/run.mjs daily
      - name: Weekly digest (first run on Monday, or on request)
        env:
          HORIXON_SITE_URL: ${{ vars.HORIXON_SITE_URL }}
        run: |
          if { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 4 ]; } || [ "${{ inputs.weekly }}" = "true" ]; then
            node backend/run.mjs weekly
          else
            echo "Not the Monday morning run; skipping weekly digest"
          fi
      - name: Commit data
        run: |
          git config user.name "horixon-bot"
          git config user.email "horixon-bot@users.noreply.github.com"
          git add -A docs data reports newsletter
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Radar update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
